cue.proxy = tcp -h cuetest01-vm -p 9019 -t 10000:tcp -h cuetest02-vm -p 9019 -t 10000:tcp -h cuetest03-vm -p 9019 -t 10000
spring.velocity.checkTemplateLocation=false

datasource.cue-data-source.driver-class-name=org.postgresql.Driver
datasource.cue-data-source.jdbc-url=${CUEBOT_DB_URL:"jdbc:postgresql://dbhost/dbname"}
datasource.cue-data-source.username=${CUEBOT_DB_USER:cue}
datasource.cue-data-source.password=${CUEBOT_DB_PASSWORD:password}

# HikariCP Configuration
# Maximum lifetime of a connection in milliseconds (5 hours = 18000000 ms)
# This should be shorter than PostgreSQL's connection timeout
datasource.cue-data-source.max-lifetime=18000000

# Maximum time to wait for a connection from the pool (30 seconds)
datasource.cue-data-source.connection-timeout=30000

# Maximum time a connection can remain idle (10 minutes)
datasource.cue-data-source.idle-timeout=600000

# Minimum number of idle connections to maintain
datasource.cue-data-source.minimum-idle=5

# Maximum number of connections in the pool
datasource.cue-data-source.maximum-pool-size=20

# Connection test query to validate connections
datasource.cue-data-source.connection-test-query=SELECT 1

# How often to check for idle connections that can be evicted (30 seconds)
datasource.cue-data-source.leak-detection-threshold=30000

grpc.cue_port=${CUEBOT_GRPC_CUE_PORT:8443}
grpc.rqd_server_port=${CUEBOT_GRPC_RQD_SERVER_PORT:8444}
grpc.max_message_bytes=104857600
# Number of entries allowed in the RQD channel cache
grpc.rqd_cache_size=2000
# RQD Channel Cache Expiration in Minutes
grpc.rqd_cache_expiration=5
# RQD Channel Cache expected concurrency
grpc.rqd_cache_concurrency=20
# RQD Channel task deadline in seconds
grpc.rqd_task_deadline=10
# Time to wait for in-flight gRPC RPCs to finish during shutdown (ms).
# Should exceed the slowest legitimate RPC so FrameCompleteReport handlers
# can finish submitting post-frame work to the queues before they are torn down.
grpc.shutdown_grace_ms=30000

# Healthy Threadpool Executor
booking_queue.threadpool.health_threshold=10
booking_queue.threadpool.core_pool_size=10
booking_queue.threadpool.max_pool_size=14
booking_queue.threadpool.queue_capacity=2000
dispatch.threadpool.core_pool_size=6
dispatch.threadpool.max_pool_size=8
dispatch.threadpool.queue_capacity=2000
healthy_threadpool.health_threshold=6
healthy_threadpool.min_unhealthy_period_min=3
# Time HealthyThreadPool drains queued work during shutdown (ms).
# Should exceed grpc.shutdown_grace_ms so post-frame work submitted just before
# the gRPC server stopped has time to complete.
healthy_threadpool.shutdown_drain_ms=60000
report_queue.threadPoolSizeInitial=6
report_queue.threadPoolSizeMax=12
# The queue size should be bigger then the expected amount of hosts
report_queue.queueSize=5000
kill_queue.threadPoolSizeInitial=2
kill_queue.threadPoolSizeMax=6
kill_queue.queueSize=1000
# Time HostReportQueue (reportQueue/killQueue) drains during shutdown (ms).
host_report_queue.shutdown_drain_ms=60000

# Turn on/off jobCompletion mailing module
mailing.enabled=true

# Whether or not to enable publishing to a messaging topic.
# Set to a boolean value. See com/imageworks/spcue/services/JmsMover.java.
messaging.enabled=false

# Default root directory for which logs will be stored if no other OS is defined.
# See com/imageworks/spcue/util/JobLogUtil.java.
# Override this via environment variable (CUE_FRAME_LOG_DIR) or command line flag
# (--log.frame-log-root.default_os). Command line flag will be preferred if both are provided.
log.frame-log-root.default_os=${CUE_FRAME_LOG_DIR:/shots}
# To set up root directories for other OS create new environment
# variable as `log.frame-log-root.[OS] where OS relates to str_os on the job table
# For example:
#   - log.frame-log-root.linux=${CUE_FRAME_LOG_DIR:/shots}
#   - log.frame-log-root.Windows=${CUE_FRAME_LOG_DIR:/S:}
# Note that for Windows, either forward or back slashes will work. However if CUE_FRAME_LOG_DIR is empty
# and S directory is in the root, the path will be broken due to the slash in front of S. Hence, if you
# are planning to use a folder in the root, use:
#   - log.frame-log-root.Windows=${S:}

# Loki
# To enable rqd frame logs to Loki configure the url as shown below. When Loki
# rqd frame logs are enable all frame logs will be streamed to the loki server instead of using the
# CUE_FRAME_LOG_DIR filesystem path. Refer to the documentation on how to configure Loki.

# This is the base url of the Loki server. If the url is not reachable, rqd will fail running frames. If it is empty
# it will not use the Loki backend for logging
log.loki.url=

# Maximum number of jobs to query.
dispatcher.job_query_max=20
# Number of seconds before waiting to book the same job from a different host.
# "0" disables the job_lock
dispatcher.job_lock_expire_seconds=20
# Concurrency level to allow on the job lock cache
dispatcher.job_lock_concurrency_level=14
# Maximum number of frames to query from the DB to attempt to dispatch.
dispatcher.frame_query_max=20
# Maximum number of frames to book at one time on the same host.
dispatcher.job_frame_dispatch_max=8
# Maximum number of frames to dispatch from a host at one time.
dispatcher.host_frame_dispatch_max=12

# ---- E-PVM Scheduler (Planner) ----------------------------------------------
# A whole-farm scheduler that replaces the legacy per-host BookingQueue dispatch
# path. Each tick it snapshots the whole farm, groups hosts by static spec
# (alloc, tags, os, gpu) and runs one candidate-layer query per group (instead
# of one query per host), then scores every placement by opportunity cost -- how
# much future capacity it would strand (E-PVM) -- rather than booking the first
# frame that fits. It also reserves hosts for wide layers that would otherwise
# starve and EASY-style backfills lower-priority frames around those
# reservations. Placement decisions are made by a single writer thread over the
# snapshot (only the per-host plan reads run in parallel); cross-Cuebot leader
# election is via a Postgres advisory lock.
#
# Tri-state progressive-rollout switch (default "no"):
#   no       -- off; the legacy dispatcher owns every show.
#   facility -- the scheduler owns ALL shows; HostReportHandler suppresses the
#               legacy BookingQueue enqueue (the old scheduler.enabled=true).
#   managed  -- the scheduler owns only shows flagged b_scheduler_managed=true
#               (set per show via the show API, same as the Rust scheduler); the
#               legacy dispatcher keeps the rest.
# Back-compat: "true" maps to facility, "false" to no.
scheduler.enabled=no
# Tick interval, in milliseconds. Render frames run for minutes to hours, so a
# few seconds between planning passes is plenty responsive and keeps the
# per-tick farm-wide query off the database hot path.
scheduler.interval_ms=3000
# Maximum candidate layers fetched per host group per tick. Layers below
# this cut are by definition lower priority and considered on a later tick.
scheduler.layer_candidates_per_group_max=2000
# Thread-pool sizing. The planner makes every placement decision on one thread;
# the only parallelism is the read-only per-host plan phase and the
# fire-and-forget RQD launches after the single batched commit (there is no
# commit worker pool). read_pool_size: threads for the parallel plan reads
# (defaults to launch_pool_size). launch_pool_size: threads for the post-commit
# RQD launches. launch_queue_size: bound on queued launches; on overflow a
# launch is dropped and recovered by RQD report reconciliation, so a slow RQD
# never stalls the tick.
scheduler.read_pool_size=8
scheduler.launch_pool_size=8
scheduler.launch_queue_size=16384
# Whether the planner makes and enforces persistent host reservations for
# blocked layers. When false, the scheduler runs as a pure placement core
# (no reservations made or enforced), useful for isolating core behaviour.
scheduler.reservations_enabled=true
# Reservation gating (EASY/Maui-style: Lifka 1995; Jackson et al. 2001).
# reservation_block_seconds: net blocked time (a leaky bucket) a layer must
# accrue before it may reserve hosts. reservation_max_fraction: the most of a
# layer's fitting hosts reservations may hold, so a host class can never be
# fully reserved. See docs/_docs/developer-guide/planner.md section 3.2 for
# the full model (the width gate, the leaky bucket, and how grants are
# awarded by the priority-weighted lottery).
scheduler.reservation_block_seconds=300
scheduler.reservation_max_fraction=0.5
# Maximum number of NEW reservation grants per tick. Existing holders always
# reconcile. Caps the O(layers x hosts) work at full-farm scale.
scheduler.reservation_max_grantees=8
# EASY backfill (Lifka 1995): instead of leaving a reserved host idle while it
# drains toward its (wide) reserving layer, let a lower-priority frame run on
# its free cores, but only if that frame's worst-case runtime
# (layer_usage.int_clock_time_high) finishes before the host is projected to
# free enough cores for its owner, so the reserved job is never delayed. This
# recovers the utilization a pure freeze would waste. Requires runtime history
# on the borrowing layer; layers with no history are never backfilled.
scheduler.backfill_enabled=true
# One layer may hold at most this fraction of a host's cores (never below 8
# frames, so small hosts still anchor a cache-warm batch). Stops a flood of
# identical frames from blanketing one machine (blast radius, phase-locked
# IO); the flood spills to the next host instead. 0 disables the cap.
scheduler.layer_host_max_frac=0.25
# Memory-per-core ratio (KB per core) for rss-driven layer sizing
# (planner.md 3.9): a threadable layer really using 18G of rss books
# round(18G / ratio) cores. The default 0 derives the ratio from each host
# group's own machines (total memory over total cores), so sizing follows
# the hardware with no tuning. Set a value (e.g. 4194304 for 4G/core) to pin
# your studio's core-selling ratio, uniform across mixed hardware.
scheduler.mem_per_core=0
# Placement-score (E-PVM) dimension weights: relative importance of each
# resource dimension on the utilization-fraction scale (planner.md 3.1). GPUs
# default higher so a GPU layer prefers the host where it strands the least
# GPU capacity.
scheduler.score_weight_cores=1.0
scheduler.score_weight_mem=1.0
scheduler.score_weight_gpus=4.0
scheduler.score_weight_gpu_mem=1.0
# Cadence (seconds) of the consolidated INFO "Scheduler stat:" line: one full
# snapshot per window of planner health and HA leadership, farm fill, throughput
# and loss, and reservation/backfill activity (per-tick detail stays at DEBUG).
# Emitted by every Cuebot, leader or standby, so a standby still heartbeats.
# Lower it during a live incident, raise it to quiet the log. Default 5 minutes.
scheduler.stat_interval_seconds=300
# Bound on the post-complete work queue (depend satisfaction, completion
# checks) fed by the scheduler's completion drain. Nothing is dropped on
# overflow; the drain runs the work inline instead (back-pressure). Depth is
# reported as postQ= on the Scheduler stat line.
scheduler.post_complete_queue_size=10000

# ---- live application licenses ----------------------------------------------
# Gate placement of licensed layers on how many seats the LICENSE SERVER says are
# free, not on a static cap. A Limit (limit_record) is a number an admin typed;
# it cannot see the seats artist workstations, CI and other farms are holding, so
# on a shared pool it is either wrong or set so low it wastes the farm.
#
# A layer declares what it needs in its environment:
#     CUE_LICENSES=hengine,katana
# and needs a seat in EVERY pool it lists. That declaration IS the switch: there
# is deliberately no separate enable flag, because a licence is a requirement of
# the work rather than a site preference, and a flag that must be remembered
# eventually is not, leaving the farm booking straight through a licence pool.
# Layers that declare nothing are untouched and cost nothing.
#
# If a layer asks for a licence and no provider is configured below, that layer is
# HELD and a warning is logged. Running it blind is the one outcome worse than not
# running it.
# Where the live numbers come from. Either an endpoint or a site script wrapping
# a vendor CLI (sesictrl, rlmutil, lmstat); both return the same JSON:
#   {"queried_at": <epoch s>,
#    "licenses": [{"name": "hengine", "feature": "Houdini Engine", "total": 800,
#                  "available": 794, "host_based": false,
#                  "hosts": [{"host": "wolf1018", "count": 1}]}]}
# `available` is server truth and already nets out every consumer including us.
# `hosts` is optional: it enables seat counting for host_based licenses and
# reveals render nodes dual-used as workstations.
#   scheduler.license.provider=http://houdini-lic:9101/licenses
#   scheduler.license.provider=script:/site/bin/cue_licenses.sh
scheduler.license.provider=
# Poll cadence. Every Cuebot polls, not just the planning leader, so a standby
# promoted by failover already holds a fresh sample.
scheduler.license.poll_seconds=20
# Hard deadline on one provider call; a hung vendor CLI is killed on it.
scheduler.license.timeout_seconds=10
# Age at which a sample stops being actionable. Past it the planner FAILS CLOSED:
# licensed layers are held. Over-booking a pool we cannot see fails frames out on
# the farm at checkout; holding them costs throughput on licensed layers only.
scheduler.license.stale_seconds=300
# Extra seconds added to the in-flight window (frames booked since the sample was
# taken, which the license server has not seen yet). A provider that stamps its
# response when collection FINISHES claims a sample fresher than it is, and the
# frames booked during that collection would then be counted neither in
# `available` nor as in-flight -- the one arithmetic that lets a tick over-book.
# Padding can only over-count in-flight, which books slightly less; erring the
# other way fails frames at checkout. Raise it if the provider is slow.
scheduler.license.inflight_pad_seconds=5
# Seats kept back for interactive users, so the farm never takes the last one.
# Also absorbs the poll-window race. Per license:
#   scheduler.license.headroom.hengine=5
scheduler.license.headroom.default=0
# Layer environment key that carries the license names.
scheduler.license.env_key=CUE_LICENSES
# Exit statuses meaning "the application could not get a license". Such a frame is
# requeued WAITING without spending a retry: it is a contended resource, not a
# broken frame, and burning retries on it would march a whole layer to DEAD when a
# pool is merely busy. The live gate plus headroom are what prevent this; the
# requeue catches the race they cannot -- an artist taking the last seat between
# the planner's sample and the real checkout. Vendor specific, so it is empty by
# default and frame completion behaves exactly as before until a site sets it.
#   scheduler.license.denied_exit_statuses=11,203
scheduler.license.denied_exit_statuses=

# Choose between different scheduling strategies:
#  - PRIORITY_ONLY: Sort by priority only
#  - FIFO: Whether or not to enable FIFO scheduling in the same priority.
#  - BALANCED: Use a rank formula that takes into account time waiting, and number
#      of cores required: rank = priority + (100 * (1 - (job.cores/job.int_min_cores))) + age in days
#      layer limiting is also disabled in this mode for performance reasons
dispatcher.scheduling_mode=PRIORITY_ONLY

# The minimum amount of available space on the temporary directory (mcp) to book a host.
# Hosts with less free space than the limit will be marked as REPAIR
# If equals to -1, it means the feature is turned off
dispatcher.min_available_temp_storage_percentage=5

# Percentage of used memory to consider a risk for triggering oom-killer
# If equals to -1, it means the feature is turned off
dispatcher.oom_max_safe_used_physical_memory_threshold=0.9

# Percentage of used swap to consider a risk for triggering oom-killer
# If equals to -1, it means the feature is turned off
dispatcher.oom_max_safe_used_swap_memory_threshold=0.05

# How much can a frame exceed its reserved memory.
#  - 0.5 means 50% above reserve
#  - -1.0 makes the feature inactive
# This feature is being kept inactive for now as we work on improving the
#  frame retry logic (See commit comment for more details).
dispatcher.oom_frame_overboard_allowed_threshold=-1.0

# In-process Scheduler OOM tracking (OomMemoryTracker). A layer that accrues
# oom_layer_escalate_threshold OOMs within the retention window gets its memory
# raised once; every other OOM bumps just the offending frame. The retention
# windows below say how long a frame's bump and a layer's OOM count are
# remembered; memory-hungry frames routinely run for hours, so keep these
# comfortably above your longest expected frame runtime.
dispatcher.oom_layer_escalate_threshold=3
dispatcher.oom_frame_bump_expire_hours=6
dispatcher.oom_streak_expire_hours=6

# How many times should cuebot send a kill request for the same frame-host before reporting
# the frame as stuck
dispatcher.frame_kill_retry_limit=3

# Prevent silent frame double-booking (free-then-rebook): when a running frame is released back to
# a bookable state (lost/down/orphaned proc), kill the frame on RQD before clearing the proc so a
# still-rendering host cannot keep working a frame that gets re-booked elsewhere. A genuinely dead
# host simply times out and release proceeds. This also gates the retry path: a user-initiated
# retry of a running frame kills the render and confirms it dead (see
# dispatcher.retry_frame_kill_budget_ms) before resetting the frame to WAITING, and defers the
# retry (leaving the frame RUNNING) when the render cannot be confirmed dead. Default = true.
dispatcher.kill_running_frame_before_release_enabled=true

# How long a user-initiated retry waits for RQD to confirm killed renders have exited before the
# remaining retries are deferred (deferred frames are left RUNNING and can be retried again). The
# budget is shared across a single retry request, not granted per frame: a bulk retry of many
# running frames kills each render but stops waiting on confirmations once the budget is spent.
# Note this bounds the confirmation waiting only. Every frame still costs one kill RPC bounded by
# grpc.rqd_task_deadline, so a bulk retry of N frames against unreachable hosts can take up to this
# budget plus N * grpc.rqd_task_deadline; size bulk retries against that, not against this value
# alone. Only used when dispatcher.kill_running_frame_before_release_enabled is true.
# Default = 10000.
dispatcher.retry_frame_kill_budget_ms=10000

# Companion to the setting above. Flapping and genuinely-dead hosts are indistinguishable at kill
# time: when the kill-before-release cannot confirm the frame stopped (the RQD kill threw, or the
# kill already failed upstream) and the host is not confirmed dead (not marked DOWN and still Up),
# releasing the frame would re-book it onto a second host while the original RQD keeps rendering.
# When true, the release is deferred in that case: the proc and its RUNNING frame are left intact
# (preserving the host<->frame link) and reclaimed later once the host is confirmed DOWN or the
# frame completes naturally. Set to false to restore the prior always-release behavior. Default =
# true.
dispatcher.defer_release_on_failed_kill_enabled=true

# Upper bound on the deferral above, measured as time since the proc's last ping proved its frame
# alive on its host (proc.ts_ping stops advancing once the host stops reporting that frame). Once
# a lost proc has gone unpinged longer than this and its kill still cannot confirm the frame
# stopped, the proc is released but the frame is failed closed to DEAD (manual retry) instead of
# WAITING, so an unconfirmable render can neither linger RUNNING forever nor be auto-rebooked
# while it may still be alive. Mirrors maintenance.orphaned_frame_max_defer_ms on the
# orphaned-frame side. Negative disables the bound (defer indefinitely). Default is 20 minutes.
dispatcher.lost_proc_max_defer_ms=1200000

# Time allowed for confirming a frame's state after its launchFrame RPC failed without proving the
# frame did not start (deadline expired, connection dropped mid-call): the request may have been
# delivered and the render may be running, so the dispatcher asks the host's RQD before touching
# the booking. Confirmed running keeps the booking, which finishes through its own frame complete
# report; confirmed not running releases it for re-dispatch; anything unconfirmable keeps it (fail
# closed). Confirming "not running" takes two polls dispatcher.launch_confirm_poll_interval_ms
# apart, since a single poll reports a launch the host received but has not started yet as gone.
# This value is therefore a ceiling, not the wait itself: it only gates whether that second poll
# still fits once the first has answered, and is sized to cover a first poll that runs all the way
# to grpc.rqd_task_deadline plus one poll interval. Set below the poll interval, nothing is ever
# released. A kept booking holds its proc and RUNNING frame until the orphaned-proc sweep reclaims
# them (procs unpinged for a hard-coded 5 minutes, ORPHANED_PROC_INTERVAL in ProcDaoJdbc), or, when
# the host is still marked Up but unreachable, until dispatcher.lost_proc_max_defer_ms expires and
# the frame is parked DEAD for manual retry. Zero or negative releases immediately with a
# best-effort kill. Default = 20000.
dispatcher.launch_confirm_budget_ms=20000

# Delay between the two confirmation polls above: how long a launch the host received but has not
# registered yet is given to surface before the booking is released. A host whose launchFrame RPC
# blew its grpc.rqd_task_deadline is by definition slow, so this is deliberately wider than that
# deadline's granularity. It is also how long a booking-queue thread blocks per resolved launch,
# and only when the host answers: an unreachable host fails the first poll and returns at once.
# Default = 7000.
dispatcher.launch_confirm_poll_interval_ms=7000

# When a reported running frame's resource_id maps to a proc that now owns a different frame, the
# frame is demonstrably owned elsewhere: kill it immediately instead of waiting for the grace and
# isOrphan windows. Set to false to disable this immediate kill; such mismatched frames are then
# left untouched by host-report verification (neither killed nor reclaimed here). Default = true.
dispatcher.frame_verification_strict_fencing_enabled=true

# Seconds a reported running frame whose resource_id maps to no proc is shielded from verification
# kills, covering the book->first-report propagation window for a just-booked proc. Default = 120.
dispatcher.frame_verification_grace_period_seconds=120

# Automatic layer booking backoff: comma-separated exit_status:minutes pairs
# (e.g. "330:5,332:60"). When a frame reports one of these exit statuses, the whole layer's
# booking is deferred that many minutes (layer.ts_start_after) instead of the frame consuming a
# retry or dying — intended for operator-configured statuses like a license shortage, where every
# frame of the layer needs the same scarce resource. Frames retry indefinitely while the condition
# persists. The statuses must agree with the substitute exit statuses RQD is configured to emit
# via rqd.yaml runner.log_exit_status_rules; 330 is the conventional license-shortage code.
# Malformed entries are skipped with a warning. Empty (the default) disables the feature.
dispatcher.layer_delay.rules=

# Whether to turn off booking for all allocations.
# On this mode, host will report their status but will never get booked.
# Default = false
# dispatcher.turn_off_booking=false

# The default amount of memory reserved for a frame if no memory
# reservation settings are specified.
# Default = 4GB
dispatcher.memory.mem_reserved_default = 3355443

# The maximum amount of memory that can be requested for a given frame.
# Default = 50GB
dispatcher.memory.mem_reserved_max = 52428800

# The minimum amount of memory that can be assigned to a frame.
# Default = 250MB
dispatcher.memory.mem_reserved_min = 262144

# Memory reserved by system, gets chopped off the available memory
# Default = 500MB
dispatcher.memory.mem_reserved_system = 524288

# The default amount of gpu memory reserved for a frame if no gpu memory
# reservation settings are specified
dispatcher.memory.mem_gpu_reserved_default = 0

# The minimum amount of gpu memory that can be assigned to a frame.
dispatcher.memory.mem_gpu_reserved_min = 0

# The maximum amount of gpu memory that can be assigned to a frame.
# Default = 100GB
dispatcher.memory.mem_gpu_reserved_max = 104857600

# Whether to satisfy dependents (*_ON_FRAME and *_ON_LAYER) only on Frame success
depend.satisfy_only_on_frame_success=true

# Jobs will be archived to the history tables after being completed for this long.
history.archive_jobs_cutoff_hours=72

# Delete down hosts automatically.
maintenance.auto_delete_down_hosts=false

# Enable/disable the orphaned frame check maintenance task (clears frames left RUNNING with no
# proc). Runs on its own trigger and lock, independent of the hardware-state check.
maintenance.orphaned_frame_check_enabled=true

# Interval in milliseconds between orphaned frame check passes. Default is 60 seconds. Keep the
# kill budget below this so a pass cannot overrun into the next one.
maintenance.orphaned_frame_check_interval_ms=60000

# Total wall-clock budget (milliseconds) per pass for killing orphaned frames (RUNNING with no
# proc) on their last host and confirming the render is dead. Frames confirmed dead are reset to
# WAITING (auto-retry). Frames not confirmed dead before this budget is spent are deferred (left
# RUNNING after a best-effort kill) and retried next pass, which destroys no work and is still safe
# against double booking. Default is 10 seconds.
maintenance.orphaned_frame_kill_budget_ms=10000

# Per-frame ceiling (milliseconds) on how long to wait for a single orphaned frame's render to
# confirm dead. Bounds one slow-to-exit render so it cannot monopolize the whole pass budget; the
# frame is deferred to the next pass instead. Default is 5 seconds.
maintenance.orphaned_frame_confirm_timeout_ms=5000

# How long (milliseconds) a frame may stay orphaned-and-unconfirmable (measured from its last
# update) before it is failed closed (DEAD) instead of being deferred again. Bounds deferral so a
# frame that can never be confirmed dead surfaces for manual retry rather than lingering RUNNING
# forever. Default is 1 hour.
maintenance.orphaned_frame_max_defer_ms=3600000

# Maximum number of orphaned frames to process per pass. Bounds the work of a fleet-wide event; the
# remainder is picked up on subsequent passes. Default is 100.
maintenance.orphaned_frame_batch_size=100

# Maximum number of orphaned procs (proc.ts_ping stale) to process per hardware-state pass. The
# orphan query returns oldest-ping first, so the longest-stale procs are always retried; procs
# whose release keeps being deferred (host up but the kill cannot confirm the frame stopped)
# occupy the batch until they release or hit dispatcher.lost_proc_max_defer_ms. Raise this if a
# large fleet event leaves more unconfirmable procs than one batch and genuinely-releasable
# orphans are waiting behind them. Default is 100.
maintenance.orphaned_proc_batch_size=100

# Interval in milliseconds for subscription recalculation task.
# Default is 2 hours (7200000 ms). This task fixes subscription
# accountability issues that can occur at large scale.
maintenance.subscription_recalculation_interval_ms=7200000

# Enable/disable the stuck dependency recovery maintenance task.
maintenance.stuck_dependency_recovery_enabled=true

# Interval in milliseconds for stuck dependency recovery task.
# Default is 10 minutes (600000 ms). This task finds and fixes frames
# stuck in DEPEND state due to transient failures during dependency satisfaction.
maintenance.stuck_dependency_recovery_interval_ms=600000

# Maximum number of depends/frames to process per recovery run.
maintenance.stuck_dependency_recovery_batch_size=1000

# Set hostname/IP of the smtp host. Will be used for mailing
smtp_host=smtp

# Flags related to a job that runs periodically to deactivate shows that haven't been
#  receiving jobs.
# A comma separated list of shows that won't be deactivated by the scheduled tasks
protected_shows=testing
# Number of days a show needs to be stale before it gets deactivated.
#  -1 means shows should not get deactivated at all.
max_show_stale_days=-1

# These flags determine whether layers/frames will be readonly when job is finished.
# If flags are set as true, layers/frames cannot be retried, eaten, edited dependency on, etc.
layer.finished_jobs_readonly=false
frame.finished_jobs_readonly=false

# Enable Prometheus metrics collecting module
metrics.prometheus.collector=false
# What environment variable to use to acquire the deployment environment id (et. dev, prod, staging)
metrics.prometheus.environment_id.environment_variable=DEPLOYMENT_ENVIRONMENT

# ==================================================================================
# Render Farm Monitoring Configuration
# ==================================================================================

# Kafka Event Publishing
# Enable/disable Kafka event publishing for render farm statistics
monitoring.kafka.enabled=${MONITORING_KAFKA_ENABLED:false}

# Kafka broker connection string (comma-separated list of host:port)
monitoring.kafka.bootstrap.servers=${MONITORING_KAFKA_SERVERS:localhost:9092}

# Kafka producer settings
monitoring.kafka.acks=1
monitoring.kafka.retries=3
monitoring.kafka.batch.size=16384
monitoring.kafka.linger.ms=10
monitoring.kafka.buffer.memory=33554432
monitoring.kafka.compression.type=lz4

# Kafka consumer settings (for Elasticsearch indexing)
monitoring.kafka.consumer.group.id=opencue-elasticsearch-indexer
monitoring.kafka.consumer.auto.offset.reset=earliest
monitoring.kafka.consumer.enable.auto.commit=true
monitoring.kafka.consumer.auto.commit.interval.ms=5000
monitoring.kafka.consumer.max.poll.records=500

# Elasticsearch Historical Storage
# Enable/disable Elasticsearch storage for historical data
monitoring.elasticsearch.enabled=${MONITORING_ELASTICSEARCH_ENABLED:false}

# Elasticsearch connection settings
monitoring.elasticsearch.host=${MONITORING_ELASTICSEARCH_HOST:localhost}
monitoring.elasticsearch.port=${MONITORING_ELASTICSEARCH_PORT:9200}
monitoring.elasticsearch.scheme=${MONITORING_ELASTICSEARCH_SCHEME:http}

# ==================================================================================
# Scheduler accounting NOTIFY (see docs/_docs/developer-guide/scheduler-accounting.md)
# ==================================================================================
# Emit per-release and enforced cap-change deltas to the standalone Rust scheduler
# via Postgres pg_notify, inside the same transaction as each DB write. Only affects
# shows whose b_scheduler_managed=true is owned by the scheduler. When false, the
# scheduler degrades to periodic recompute from SUM(proc) (under-books, never
# over-books), so disabling is safe.
accounting.notify.enabled=${ACCOUNTING_NOTIFY_ENABLED:true}
